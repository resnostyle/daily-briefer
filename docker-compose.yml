# Required: copy .env.example to .env and set TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
# For ChatGPT brief, set OPENAI_API_KEY in .env.
# Default: container runs all briefs. Override with command to run one script.
services:
  daily-briefing:
    build: .
    image: daily-briefing:latest
    env_file: .env
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PROMPTS_YAML_PATH=${PROMPTS_YAML_PATH:-}
      - POST_TYPE=${POST_TYPE:-}
    # No command = run all briefs. Or run one: command: ["github"], command: ["hn"], command: ["chatgpt"], command: ["post", "quote"]
